name: Missing translations

# Finds missing translations in the app (src/locales), the website (website/i18n)
# and the manual (manual/i18n) and keeps one issue per language up to date:
# opened when something is missing, updated when the list changes, closed when
# everything is translated. Report: scripts/i18n-report.mjs, issues: scripts/i18n-issues.mjs.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'website/i18n/**'
      - 'manual/docs/**'
      - 'manual/i18n/**'
      - 'manual/docusaurus.config.ts'
      - 'scripts/i18n-*.mjs'
      - '.github/workflows/i18n-issues.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would change, do not touch issues'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: i18n-issues
  cancel-in-progress: false

jobs:
  issues:
    # Only in the main repository, not in forks
    if: github.repository == 'KizamuBeam/kizamubeam'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # scripts/i18n-check.mjs needs the TypeScript parser
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Collect missing translations
        run: |
          node scripts/i18n-report.mjs --out i18n-report.json --repo-url "${{ github.server_url }}/${{ github.repository }}" --sha "${{ github.sha }}" > i18n-report.txt
          cat i18n-report.txt
          { echo '```'; cat i18n-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close issues
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const fs = require('fs');
            const { syncIssues } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/i18n-issues.mjs`);
            const report = JSON.parse(fs.readFileSync('i18n-report.json', 'utf8'));
            const log = await syncIssues({ github, context, core, report, dryRun: process.env.DRY_RUN === 'true', sha: context.sha.slice(0, 7) });
            await core.summary.addTable([[{ data: 'Language', header: true }, { data: 'Action', header: true }, { data: 'Issue', header: true }], ...log.map((l) => [l.lang, l.action, l.number ? `#${l.number}` : ''])]).write();
